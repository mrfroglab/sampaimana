name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sampaimana-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, Lint, Build & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs:check rebuilds CHANGELOG.md from the full history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm docs:check

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SITE_URL=https://sampaimana.hallojanu.me
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad Server
    needs: build
    if: github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab'
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy with Docker Compose
        run: |
          COMPOSE=/opt/stacks/apps/sampaimana/docker-compose.yml
          docker compose -f "$COMPOSE" pull web
          docker compose -f "$COMPOSE" up -d --no-deps web
          docker image prune -f
      - name: Verify container is healthy
        run: |
          for _ in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sampaimana-web 2>/dev/null || true)
            if [ "$s" = healthy ]; then
              docker exec sampaimana-web node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                && { echo "sampaimana-web healthy and rendering on :3000"; exit 0; }
            fi
            sleep 3
          done
          echo "sampaimana-web is not healthy. Check: docker logs sampaimana-web" >&2
          docker logs --tail 50 sampaimana-web >&2 || true
          exit 1
